# 条件 Latent Diffusion 配置 (class-conditional)
# 和 train_latdiff.yaml 的区别: 多了 num_classes, ckpt/图 换到 _cond 目录
# 第一阶段产物仍是那个冻结的普通 VAE (latent_dim=16)
seed: 42
vae_ckpt: "/public/home/liuhuan/workspace_xd/ckpt/vae_test/vae_mnist.pt"
data_dir: "/public/home/liuhuan/workspace_xd/data"
output_dir: "/public/home/liuhuan/workspace_xd/ckpt/vae_test/latdiff_cond"
image_dir: "/public/home/liuhuan/workspace_xd/vae_test/output/images/latdiff_cond"

diffusion:
  timesteps: 100        # 扩散步数 T: 加噪/去噪的总台阶数
  hidden_dim: 128       # 去噪 MLP 宽度
  time_dim: 64          # 时间步嵌入维度
  num_classes: 10       # ← 新增: 数字类别数(0-9), one-hot 条件维度

training:
  epochs: 30
  batch_size: 256
  learning_rate: 2.0e-4
  log_steps: 100
